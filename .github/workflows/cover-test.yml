name: Cover test

on:
  workflow_dispatch:

jobs:
  cover:
    name: Cover conversion (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        shell: powershell
        run: |
          $code = Get-Content src/main/resources/assets/mediahud/media.ps1 -Raw
          Invoke-Expression ($code.Substring(0, $code.IndexOf('# --- Hauptschleife ---')))

          # JPEG wie von Spotify erzeugen
          $path = Join-Path $env:RUNNER_TEMP 'cover.jpg'
          $src = New-Object System.Drawing.Bitmap 300, 300
          $g = [System.Drawing.Graphics]::FromImage($src); $g.Clear([System.Drawing.Color]::OrangeRed); $g.Dispose()
          $src.Save($path, [System.Drawing.Imaging.ImageFormat]::Jpeg); $src.Dispose()

          $fileType = [Windows.Storage.StorageFile, Windows.Storage, ContentType=WindowsRuntime]
          $refType = [Windows.Storage.Streams.RandomAccessStreamReference, Windows.Storage.Streams, ContentType=WindowsRuntime]
          $file = Await ($fileType::GetFileFromPathAsync($path)) $fileType
          $ref = $refType::CreateFromFile($file)

          # Alter Weg (ohne Kopie in den Speicher)
          try {
            $ws = Await ($ref.OpenReadAsync()) $streamType
            $s = [System.IO.WindowsRuntimeStreamExtensions]::AsStreamForRead($ws)
            Write-Host "old: CanSeek=$($s.CanSeek)"
            $img = [System.Drawing.Image]::FromStream($s)
            Write-Host "old: OK $($img.Width)x$($img.Height)"
          } catch { Write-Host "old: FAILED $($_.Exception.InnerException.Message) $($_.Exception.Message)" }

          # Neuer Weg
          $b64 = Get-Cover $ref
          if ($b64 -eq '') { throw 'Get-Cover returned nothing' }
          $bytes = [Convert]::FromBase64String($b64)
          $out = [System.Drawing.Image]::FromStream((New-Object System.IO.MemoryStream (,$bytes)))
          Write-Host "new: $($out.Width)x$($out.Height) $($out.RawFormat.Guid) base64Length=$($b64.Length)"
          if ($out.Width -ne 128 -or $out.Height -ne 128) { throw 'wrong size' }
          if ($out.RawFormat.Guid -ne [System.Drawing.Imaging.ImageFormat]::Png.Guid) { throw 'not PNG' }
          Write-Host 'Cover conversion OK'
